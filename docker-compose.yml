services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mihms
      POSTGRES_USER: mihms_user
      POSTGRES_PASSWORD: change-this-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mihms_user -d mihms"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://mihms_user:change-this-password@db:5432/mihms
      DJANGO_SECRET_KEY: replace-this-with-a-long-random-secret
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
volumes:
  postgres_data:
